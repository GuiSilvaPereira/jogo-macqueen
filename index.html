<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   Katchau! — jogo de carrinhos para crianças pequenas
   Tudo desenhado em canvas; sons sintetizados; voz pt-BR.
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, now = 0;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (a, n) => ((a % n) + n) % n;
const lerp = (a, b, t) => a + (b - a) * t;
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT = '"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';

/* ---------- armazenamento ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('mq_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mq_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- personagens ---------- */
const CARS = [
  { id: 'mcqueen', short: 'McQueen', say: 'Relâmpago McQueen! Katchau!', color: '#e3161b', dark: '#8f0b0e', kind: 'sport', bolt: true, spoiler: true, rim: '#d4161b', eye: '#2f7fd8', seed: 0 },
  { id: 'mate', short: 'Mate', say: 'Mate! O melhor guincho do mundo!', color: '#a0612e', dark: '#5a3214', kind: 'truck', rim: '#8c8c8c', eye: '#3f8f4a', seed: 1.3 },
  { id: 'sally', short: 'Sally', say: 'Sally!', color: '#5fb6e8', dark: '#22709e', kind: 'sport2', rim: '#e6e6e6', eye: '#2f6fd0', seed: 2.1 },
  { id: 'doc', short: 'Doc', say: 'Doc Hudson!', color: '#1d3f8f', dark: '#0c214f', kind: 'classic', num: '51', rim: '#e6e6e6', eye: '#4b6fa8', seed: 0.7 },
  { id: 'luigi', short: 'Luigi', say: 'Luigi! Pit stop!', color: '#f5c518', dark: '#9c7a00', kind: 'small', rim: '#e6e6e6', eye: '#7a4b1f', seed: 2.8 },
];
const RIVAL = { id: 'chick', short: 'Chick', color: '#2f9e3a', dark: '#1a5e22', kind: 'sport', num: '86', spoiler: true, mustache: true, rim: '#2f9e3a', eye: '#6b4a1f', seed: 1.9 };
let carIdx = clamp(store.get('car', 0) | 0, 0, CARS.length - 1);
let paint = store.get('paint', {}) || {};
const curCar = () => CARS[carIdx];

/* ---------- som ---------- */
const Snd = {
  ac: null, master: null, on: store.get('sound', true), engine: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ac = new AC(); this.master = this.ac.createGain();
    this.master.gain.value = this.on ? 0.7 : 0; this.master.connect(this.ac.destination);
  },
  setOn(v) { this.on = v; store.set('sound', v); if (this.master) this.master.gain.value = v ? 0.7 : 0; if (!v && window.speechSynthesis) speechSynthesis.cancel(); },
  tone(freq, dur, type = 'sine', vol = 0.3, slideTo = null, delay = 0) {
    if (!this.ac) return; const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.2, freq = 1000, delay = 0, q = 1) {
    if (!this.ac) return; const t = this.ac.currentTime + delay;
    const n = Math.max(1, Math.floor(this.ac.sampleRate * dur));
    const b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ac.createBufferSource(); s.buffer = b;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  honk() { [0, 0.24].forEach(d => { this.tone(392, 0.2, 'square', 0.13, null, d); this.tone(494, 0.2, 'square', 0.1, null, d); }); },
  ding() { this.tone(1047, 0.25, 'sine', 0.25); this.tone(1568, 0.35, 'sine', 0.18, null, 0.07); },
  pop() { this.tone(500, 0.12, 'sine', 0.25, 1100); },
  splash() { this.noise(0.4, 0.35, 700, 0, 0.8); this.tone(250, 0.25, 'sine', 0.15, 800); },
  squish() { this.noise(0.09, 0.12, rand(1800, 3200), 0, 2); },
  beep(hi) { this.tone(hi ? 1047 : 523, hi ? 0.55 : 0.25, 'square', 0.1); },
  cheer() { this.noise(1.4, 0.12, 1400, 0, 0.6); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.25, null, i * 0.14));
    this.tone(1047, 0.9, 'triangle', 0.25, null, 0.6); this.tone(1319, 0.9, 'triangle', 0.18, null, 0.6);
  },
  engineStart() {
    if (!this.ac || this.engine) return;
    const o = this.ac.createOscillator(), o2 = this.ac.createOscillator();
    const f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 55; o2.frequency.value = 27;
    f.type = 'lowpass'; f.frequency.value = 400; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o.start(); o2.start();
    this.engine = { o, o2, f, g };
  },
  engineSet(v) {
    if (!this.engine) return; const t = this.ac.currentTime, e = this.engine;
    e.o.frequency.setTargetAtTime(48 + v * 120, t, 0.12); e.o2.frequency.setTargetAtTime(24 + v * 60, t, 0.12);
    e.f.frequency.setTargetAtTime(280 + v * 900, t, 0.12); e.g.gain.setTargetAtTime(0.05 + v * 0.08, t, 0.12);
  },
  engineStop() {
    if (!this.engine) return; const e = this.engine, t = this.ac.currentTime;
    e.g.gain.setTargetAtTime(0, t, 0.05); e.o.stop(t + 0.3); e.o2.stop(t + 0.3); this.engine = null;
  }
};

/* ---------- voz ---------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text) {
  if (!Snd.on || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR';
    const v = voices.find(v => /pt[-_]BR/i.test(v.lang)) || voices.find(v => /^pt/i.test(v.lang));
    if (v) u.voice = v; u.rate = 1.0; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- utilidades de desenho ---------- */
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); c.fill(); }
function text(s, x, y, size, fill = '#fff', stroke = '#b00000', align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function emoji(e, x, y, size, rot = 0) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(e, 0, size * 0.05); ctx.restore();
}
function starPath(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.48 : r;
    c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  c.closePath();
}
function drawStar(c, x, y, r, rot, face = true) {
  starPath(c, x, y, r, rot); c.fillStyle = '#ffd21f'; c.fill();
  c.lineWidth = r * 0.14; c.strokeStyle = '#e88a00'; c.lineJoin = 'round'; c.stroke();
  if (face) {
    c.fillStyle = '#5a3200';
    ell(c, x - r * 0.18, y - r * 0.05, r * 0.08, r * 0.12); ell(c, x + r * 0.18, y - r * 0.05, r * 0.08, r * 0.12);
    c.strokeStyle = '#5a3200'; c.lineWidth = r * 0.07; c.beginPath(); c.arc(x, y + r * 0.08, r * 0.16, 0.2, Math.PI - 0.2); c.stroke();
  }
}

/* ---------- formatos dos carros (coordenadas: comprimento 200, chão em y=0) ---------- */
function coupe(p) {
  const belt = Math.min(p.rear, p.hood) - 3;
  const split = (p.cx0 + p.cx1) / 2 - 6;
  const winTop = 0.25 * belt + 0.75 * (p.roof + 14);
  const wx0 = split + 4, wx1 = p.cx1 - 8;
  return {
    belt, rearY: p.rear, split,
    eyes: { x: (wx0 + wx1) / 2, y: (winTop + belt) / 2 + 2, rx: (wx1 - wx0) / 4 + 1, ry: (belt - winTop) * 0.42 },
    mouth: { x: 88, y: (p.nose - 16) / 2 - 2 }, light: { x: 90, y: p.nose - 5 }, wheels: [-62, 62],
    body(c) {
      c.moveTo(-98, -24); c.lineTo(-98, p.rear + 8); c.quadraticCurveTo(-97, p.rear, -86, p.rear);
      c.lineTo(p.cx0, p.rear - 2);
      c.bezierCurveTo(p.cx0 + 18, p.roof, p.cx1 - 22, p.roof, p.cx1, p.hood);
      c.quadraticCurveTo(88, p.hood + 2, 98, p.nose);
      c.quadraticCurveTo(103, -22, 92, -16); c.lineTo(-90, -16); c.quadraticCurveTo(-98, -16, -98, -24);
    },
    win(c) {
      c.moveTo(p.cx0 + 9, belt);
      c.bezierCurveTo(p.cx0 + 24, p.roof + 14, p.cx1 - 26, p.roof + 14, p.cx1 - 8, belt); c.closePath();
    }
  };
}
const TRUCK = {
  belt: -70, rearY: -52, split: 12, eyes: { x: 31, y: -86, rx: 9.5, ry: 14 }, mouth: { x: 90, y: -36 }, light: null, wheels: [-62, 62],
  body(c) {
    c.moveTo(-98, -22); c.lineTo(-98, -52); c.lineTo(-24, -52); c.lineTo(-24, -104);
    c.quadraticCurveTo(-24, -112, -14, -112); c.lineTo(42, -112); c.quadraticCurveTo(52, -112, 55, -102);
    c.lineTo(62, -66); c.lineTo(90, -62); c.quadraticCurveTo(100, -60, 100, -48); c.lineTo(100, -24);
    c.quadraticCurveTo(100, -16, 92, -16); c.lineTo(-90, -16); c.quadraticCurveTo(-98, -16, -98, -22);
  },
  win(c) { c.moveTo(-9, -104); c.lineTo(41, -104); c.quadraticCurveTo(48, -104, 48, -97); c.lineTo(48, -75); c.quadraticCurveTo(48, -68, 41, -68); c.lineTo(-9, -68); c.quadraticCurveTo(-16, -68, -16, -75); c.lineTo(-16, -97); c.quadraticCurveTo(-16, -104, -9, -104); c.closePath(); }
};
const SHAPES = {
  sport: coupe({ rear: -56, roof: -116, cx0: -52, cx1: 50, hood: -58, nose: -40 }),
  sport2: coupe({ rear: -52, roof: -112, cx0: -48, cx1: 50, hood: -54, nose: -36 }),
  classic: coupe({ rear: -60, roof: -114, cx0: -44, cx1: 46, hood: -60, nose: -46 }),
  small: coupe({ rear: -62, roof: -130, cx0: -66, cx1: 54, hood: -64, nose: -50 }),
  truck: TRUCK
};

function eye(c, x, y, rx, ry, iris, lk, blink, col, dark) {
  c.fillStyle = '#fff'; ell(c, x, y, rx, ry);
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke();
  if (blink) {
    c.fillStyle = col; ell(c, x, y, rx + 1, ry + 1);
    c.strokeStyle = dark; c.lineWidth = 3; c.beginPath();
    c.moveTo(x - rx * 0.8, y + ry * 0.1); c.quadraticCurveTo(x, y + ry * 0.55, x + rx * 0.8, y + ry * 0.1); c.stroke();
    return;
  }
  const ix = x + lk.x * rx * 0.35, iy = y + lk.y * ry * 0.3;
  c.fillStyle = iris; ell(c, ix, iy, rx * 0.62, ry * 0.62);
  c.fillStyle = '#111'; ell(c, ix, iy, rx * 0.32, ry * 0.34);
  c.fillStyle = '#fff'; ell(c, ix - rx * 0.18, iy - ry * 0.22, rx * 0.15, ry * 0.14);
}

function wheel(c, x, y, r, a, rim) {
  c.fillStyle = '#161616'; circle(c, x, y, r);
  c.strokeStyle = '#3a3a3a'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r * 0.82, 0, TAU); c.stroke();
  c.fillStyle = rim; circle(c, x, y, r * 0.56);
  c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 2.5; c.beginPath();
  for (let i = 0; i < 5; i++) { const b = a + i * TAU / 5; c.moveTo(x, y); c.lineTo(x + Math.cos(b) * r * 0.5, y + Math.sin(b) * r * 0.5); }
  c.stroke(); c.fillStyle = '#444'; circle(c, x, y, r * 0.16);
}

function decor(c, car) {
  if (car.bolt) {
    const pts = [[-62, -47], [14, -45], [6, -38], [58, -33], [-8, -26], [0, -33], [-62, -36]];
    c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath();
    c.fillStyle = '#ffd21f'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#e07b00'; c.stroke();
    c.font = `italic 900 19px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 4; c.strokeStyle = '#fff'; c.strokeText('95', -30, -41); c.fillStyle = '#c00'; c.fillText('95', -30, -41);
  }
  if (car.num && !car.bolt) {
    c.fillStyle = '#fff'; circle(c, -6, -37, 13);
    c.font = `900 15px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = car.dark; c.fillText(car.num, -6, -36);
  }
  if (car.id === 'sally') {
    c.strokeStyle = 'rgba(15,45,90,.75)'; c.lineWidth = 2; c.beginPath();
    c.moveTo(-90, -40); c.bezierCurveTo(-80, -50, -70, -30, -60, -42); c.bezierCurveTo(-55, -48, -48, -40, -52, -36); c.stroke();
  }
  if (car.id === 'luigi') {
    ['#1f9d3a', '#fff', '#d4161b'].forEach((k, i) => { c.fillStyle = k; c.fillRect(-20 + i * 10, -46, 10, 16); });
    c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 1.5; c.strokeRect(-20, -46, 30, 16);
  }
  if (car.kind === 'truck') {
    c.fillStyle = '#6f3d18';
    ell(c, -72, -38, 10, 6); ell(c, -36, -30, 8, 5); ell(c, 28, -100, 6, 4); ell(c, 74, -42, 9, 6); ell(c, -10, -60, 6, 8);
    c.fillStyle = 'rgba(255,190,120,.35)'; ell(c, -55, -44, 6, 3); ell(c, 50, -50, 5, 3);
  }
}

/* desenha um carro com o ponto de contato com o chão em (x,y) e comprimento len */
function drawCar(c, x, y, len, car, o = {}) {
  const k = len / 200, P = SHAPES[car.kind];
  const custom = o.color || paint[car.id];
  const col = custom || car.color, dark = custom ? shade(custom, -0.45) : car.dark;
  c.save(); c.translate(x, y);
  if (!o.noShadow) { c.fillStyle = 'rgba(0,0,0,.22)'; ell(c, 0, 0, 96 * k, 9 * k); }
  c.translate(0, -(o.hop || 0));
  c.scale(k, k);
  if (o.squash) c.scale(1 + o.squash, 1 - o.squash);
  if (car.kind === 'small') c.scale(0.86, 1);
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (car.kind === 'truck') { // guincho
    c.strokeStyle = '#4a4a4a'; c.lineWidth = 9; c.beginPath(); c.moveTo(-40, -52); c.lineTo(-74, -96); c.stroke();
    c.lineWidth = 2.5; c.strokeStyle = '#222'; c.beginPath(); c.moveTo(-74, -96); c.lineTo(-90, -62); c.stroke();
    c.lineWidth = 5; c.strokeStyle = '#555'; c.beginPath(); c.arc(-90, -56, 6, -Math.PI / 2, Math.PI * 0.9); c.stroke();
  }
  if (car.spoiler) {
    const r = P.rearY; c.fillStyle = dark; c.fillRect(-92, r - 14, 5, 16); c.fillRect(-80, r - 14, 5, 16);
    rr(c, -103, r - 22, 36, 9, 3); c.fillStyle = col; c.fill(); c.strokeStyle = dark; c.lineWidth = 3; c.stroke();
  }
  // carroceria
  c.beginPath(); P.body(c); c.fillStyle = col; c.fill();
  c.save(); c.clip();
  c.fillStyle = 'rgba(0,0,0,.14)'; c.fillRect(-110, -30, 220, 20);
  c.fillStyle = 'rgba(255,255,255,.3)'; ell(c, 0, P.belt + 9, 82, 5);
  decor(c, car);
  c.restore();
  c.beginPath(); P.body(c); c.lineWidth = 4; c.strokeStyle = dark; c.stroke();
  // vidros + olhos
  c.save(); c.beginPath(); P.win(c); c.clip();
  c.fillStyle = '#22324a'; c.fillRect(-120, -150, 240, 150);
  c.fillStyle = 'rgba(255,255,255,.16)'; c.beginPath();
  c.moveTo(P.split - 26, -150); c.lineTo(P.split - 14, -150); c.lineTo(P.split - 44, 0); c.lineTo(P.split - 56, 0); c.fill();
  c.fillStyle = '#eef7ff'; c.fillRect(P.split + 4, -150, 120, 150);
  c.fillStyle = col; c.fillRect(P.split - 0.5, -150, 5, 150);
  const E = P.eyes, lk = o.look || { x: 0.7, y: 0 };
  const bl = o.blink !== undefined ? o.blink : mod(now + (car.seed || 0), 3.6) < 0.13;
  eye(c, E.x - E.rx + 1, E.y, E.rx, E.ry, car.eye, lk, bl, col, dark);
  eye(c, E.x + E.rx - 1, E.y, E.rx, E.ry, car.eye, lk, bl, col, dark);
  c.restore();
  c.beginPath(); P.win(c); c.lineWidth = 3; c.strokeStyle = dark; c.stroke();
  // faróis
  if (P.light) { c.fillStyle = '#fff4b0'; ell(c, P.light.x, P.light.y, 5, 4); c.strokeStyle = dark; c.lineWidth = 2; c.stroke(); }
  if (car.kind === 'truck') { c.fillStyle = '#777'; c.fillRect(16, -118, 8, 7); c.fillStyle = '#fff4b0'; circle(c, 20, -122, 6); c.strokeStyle = '#555'; c.lineWidth = 2; c.stroke(); }
  // boca
  const m = P.mouth; c.strokeStyle = '#3a0d0d'; c.lineWidth = 3;
  if (car.mustache) {
    c.fillStyle = '#111'; c.beginPath(); c.moveTo(m.x - 12, m.y - 4);
    c.quadraticCurveTo(m.x - 4, m.y - 12, m.x + 1, m.y - 6); c.quadraticCurveTo(m.x + 6, m.y - 12, m.x + 12, m.y - 4);
    c.quadraticCurveTo(m.x, m.y - 2, m.x - 12, m.y - 4); c.fill();
  }
  if (o.happy) {

/* ---------- cenário (deserto) ---------- */
function cloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  circle(ctx, x, y, s); circle(ctx, x + s * 0.9, y + s * 0.2, s * 0.75); circle(ctx, x - s * 0.9, y + s * 0.25, s * 0.7);

}
function mesa(x, base, w, h, i) {
  ctx.fillStyle = i % 2 ? '#d9773a' : '#e88a48';
  ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x + w * 0.14, base - h); ctx.lineTo(x + w * 0.86, base - h); ctx.lineTo(x + w, base); ctx.fill();
  ctx.fillStyle = 'rgba(150,60,20,.35)'; ctx.fillRect(x + w * 0.1, base - h * 0.6, w * 0.8, h * 0.1);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x + w * 0.14, base - h, w * 0.72, h * 0.06);
}
function cactus(x, base, s) {
  ctx.fillStyle = '#3c9d48'; ctx.strokeStyle = '#256b2f'; ctx.lineWidth = Math.max(1, s * 0.04);
  rr(ctx, x - s * 0.12, base - s, s * 0.24, s, s * 0.12); ctx.fill(); ctx.stroke();
  rr(ctx, x - s * 0.42, base - s * 0.7, s * 0.18, s * 0.38, s * 0.09); ctx.fill(); ctx.stroke();
  rr(ctx, x - s * 0.42, base - s * 0.42, s * 0.36, s * 0.14, s * 0.07); ctx.fill();
  rr(ctx, x + s * 0.26, base - s * 0.82, s * 0.18, s * 0.4, s * 0.09); ctx.fill(); ctx.stroke();
  rr(ctx, x + s * 0.06, base - s * 0.55, s * 0.38, s * 0.14, s * 0.07); ctx.fill();
}
function desert(off, cloudOff, horizon) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#3fb0ff'); g.addColorStop(1, '#c9eeff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);
  const m = Math.min(W, H);
  ctx.fillStyle = 'rgba(255,230,100,.35)'; circle(ctx, W * 0.86, H * 0.11, m * 0.11);
  ctx.fillStyle = '#ffe066'; circle(ctx, W * 0.86, H * 0.11, m * 0.07);
  for (let i = 0; i < 4; i++) {
    const x = mod(i * W * 0.45 - cloudOff * 0.05 - now * 12, W * 1.8) - W * 0.25;
    cloud(x, H * (0.07 + 0.06 * (i % 3)), m * (0.045 + 0.015 * (i % 2)));
  }
  const P = Math.max(W * 0.5, 260), o = off * 0.12, base = Math.floor(o / P);
  for (let k = -1; k <= Math.ceil(W / P) + 1; k++) {
    const idx = k + base, x = k * P - mod(o, P);
    const w = P * (0.55 + 0.4 * hash(idx)), h = horizon * (0.22 + 0.22 * hash(idx + 7));

}
function curbs(y, h, off, a = '#e3161b', b = '#fff') {
  const cw = Math.max(40, W * 0.06);
  for (let x = -mod(off, cw * 2) - cw * 2; x < W + cw; x += cw * 2) {
    ctx.fillStyle = a; ctx.fillRect(x, y, cw, h); ctx.fillStyle = b; ctx.fillRect(x + cw, y, cw, h);

/* ---------- partículas ---------- */
let parts = [];
function addP(p) { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, size: 6, rot: 0, vr: 0, type: 'c', color: '#fff', grow: 0 }, p, { max: p.life || 1 })); }
function updP(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += p.vr * dt; p.life -= dt; p.size = Math.max(0.5, p.size + p.grow * dt); }
  parts = parts.filter(p => p.life > 0);
}
function drawP() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
    if (p.type === 'c') { ctx.fillStyle = p.color; circle(ctx, p.x, p.y, p.size); }
    else if (p.type === 'b') {
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = Math.max(1.5, p.size * 0.12);
      ctx.fillStyle = 'rgba(200,240,255,.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; circle(ctx, p.x - p.size * 0.35, p.y - p.size * 0.35, p.size * 0.2);
    }
    else if (p.type === 'r') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9); ctx.restore(); }
    else if (p.type === 's') drawStar(ctx, p.x, p.y, p.size, p.rot, false);
    else if (p.type === 'e') emoji(p.e, p.x, p.y, p.size, p.rot);

}
const CONF = ['#e3161b', '#ffd21f', '#1e6fe0', '#2fae3a', '#ff5fa8', '#ff8a00', '#fff'];
function confetti(n) {
  for (let i = 0; i < n; i++) addP({ type: 'r', x: rand(0, W), y: rand(-60, -10), vx: rand(-60, 60), vy: rand(80, 260), g: 120, life: rand(2.5, 4), size: rand(5, 10), rot: rand(0, 6), vr: rand(-8, 8), color: CONF[i % CONF.length] });
}
function burst(x, y, n, color, speed, size, type = 'c') {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(speed * 0.4, speed); addP({ type, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: speed * 0.8, life: rand(0.5, 0.9), size: rand(size * 0.5, size), rot: rand(0, 6), vr: rand(-6, 6), color: Array.isArray(color) ? color[i % color.length] : color }); }
}

/* ---------- botões ---------- */
function drawBtn(b) {

const homeR = () => clamp(Math.min(W, H) * 0.065, 24, 44);
const homeBtn = () => ({ x: homeR() + 14, y: homeR() + 14, r: homeR(), e: '🏠', color: '#fff', fn: () => go(Home()) });

/* =========================================================
   CENA: Início (escolher carro + jogo)
   ========================================================= */
function Home() {
  const S = { hop: {} };
  function lay() {
    const port = H > W * 1.05, o = { port, cars: [] };
    o.titleY = port ? H * 0.13 : H * 0.11; o.titleS = Math.min(W * (port ? 0.085 : 0.075), H * 0.09);
    o.horizon = port ? H * 0.22 : H * 0.33;
    if (port) {
      const len = Math.min(W / 3.9, H * 0.19); [[0, 1, 2], [3, 4]].forEach((row, ri) => row.forEach((ci, j) =>
        o.cars.push({ ci, len, x: W * (j + 1) / (row.length + 1), y: H * (0.38 + ri * 0.2) })));
    } else {
      const len = Math.min(W / 5.8, H * 0.34); CARS.forEach((c, i) => o.cars.push({ ci: i, len, x: W * (i + 0.5) / 5, y: H * 0.6 }));
    }
    o.br = port ? Math.min(W * 0.12, H * 0.07) : Math.min(H * 0.1, W * 0.065);
    o.by = port ? H * 0.8 : H * 0.82;
    return o;
  }
  S.enter = () => { if (Snd.ac) say('Escolha seu carro!'); };
  S.onUnlock = () => say('Oi! Escolha seu carro!');
  S.buttons = () => {
    const o = lay(), r = clamp(Math.min(W, H) * 0.045, 18, 30), b = [];
    b.push({ x: W - r - 12, y: r + 12, r, e: Snd.on ? '🔊' : '🔇', color: '#fff', fn: () => Snd.setOn(!Snd.on) });
    const de = document.documentElement;
    if (de.requestFullscreen || de.webkitRequestFullscreen) b.push({
      x: W - r * 3.4 - 12, y: r + 12, r, e: '⛶', color: '#fff', fn: () => {
        try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else (de.requestFullscreen || de.webkitRequestFullscreen).call(de); } catch (e) {}
      }
    });
    const games = [['🏁', '#ffd21f', 'Corrida', () => go(Race())], ['🧽', '#5fd0ff', 'Lava-jato', () => go(Wash())], ['🎨', '#ff7ac0', 'Pintura', () => go(Paint())]];
    games.forEach((g, i) => b.push({ x: W * (0.2 + i * 0.3), y: o.by, r: o.br, e: g[0], color: g[1], label: g[2], pulse: true, fn: g[3] }));
    return b;
  };
  S.down = (id, x, y) => {
    for (const p of lay().cars) {
      if (Math.abs(x - p.x) < p.len * 0.55 && y < p.y + p.len * 0.08 && y > p.y - p.len * 0.7) {
        carIdx = p.ci; store.set('car', carIdx); S.hop[p.ci] = 0.6; Snd.honk(); say(CARS[p.ci].say);
        burst(p.x, p.y - p.len * 0.3, 14, '#ffd21f', 260, p.len * 0.07, 's');
        return;
      }
    }
  };
  S.update = dt => { for (const k in S.hop) S.hop[k] = Math.max(0, S.hop[k] - dt); };
  S.draw = () => {
    const o = lay();
    desert(0, 0, o.horizon);
    ctx.fillStyle = '#f2c27b'; ctx.fillRect(0, o.horizon, W, H - o.horizon);
    ctx.fillStyle = '#e8b56a'; for (let i = 0; i < 14; i++) ell(ctx, hash(i) * W, o.horizon + hash(i + 9) * (H - o.horizon), 30 + hash(i + 4) * 40, 4 + hash(i + 2) * 5);
    // título
    const ts = o.titleS * (1 + 0.03 * Math.sin(now * 3));
    text('⚡ KATCHAU! ⚡', W / 2, o.titleY, ts, '#ffd21f', '#c40000');
    // carros
    for (const p of o.cars) {
      const car = CARS[p.ci], sel = p.ci === carIdx, ht = S.hop[p.ci] || 0;
      const hop = ht > 0 ? Math.sin((1 - ht / 0.6) * Math.PI) * p.len * 0.25 : (sel ? Math.abs(Math.sin(now * 4)) * p.len * 0.03 : 0);
      if (sel) {
        const g = ctx.createRadialGradient(p.x, p.y - p.len * 0.25, 0, p.x, p.y - p.len * 0.25, p.len * 0.75);
        g.addColorStop(0, 'rgba(255,240,120,.9)'); g.addColorStop(1, 'rgba(255,240,120,0)');
        ctx.fillStyle = g; ell(ctx, p.x, p.y - p.len * 0.25, p.len * 0.75, p.len * 0.6);
      }
      drawCar(ctx, p.x, p.y, p.len * (sel ? 1.12 : 0.95), car, { hop, happy: sel || ht > 0, t: sel ? now * 3 : 0 });
      text(car.short, p.x, p.y + p.len * 0.13, Math.max(13, p.len * 0.13), sel ? '#fff' : '#fff8e0', sel ? '#c40000' : '#9a6a2a');
    }
    drawP();
    S.buttons().forEach(drawBtn);
  };
  return S;
}

/* =========================================================
   CENA: Corrida — segure o dedo para acelerar, arraste para pegar estrelas
   ========================================================= */
function Race() {
  const S = {}, car = curCar();
  const maxV = Math.max(W, 600) * 0.95, L = maxV * 20;
  let dist = 0, v = 0, py = 0, ty = 0, stars = [], nextStar = 0, rivalOff = 0, t = 0;
  let count = 3.6, lastCount = 4, goT = 0, touched = false, hintSaid = false, done = false, doneT = 0, collected = 0;
  let wheelA = 0, rwheelA = 0, puffT = 0, hudPop = 0;
  const ptrs = new Set();
  let carLen, roadTop, playerX, yMin, yMax;
  S.resize = () => {
    roadTop = H * 0.5; carLen = clamp(Math.min(W * 0.28, H * 0.34), 90, 340); playerX = W * 0.3;
    yMin = roadTop + carLen * 0.3; yMax = H - carLen * 0.07;
    if (!py) { py = lerp(yMin, yMax, 0.75); ty = py; }
    py = clamp(py, yMin, yMax);
  };
  S.resize(); nextStar = W * 0.9;
  const rivalY = () => lerp(yMin, yMax, 0.12);
  S.enter = () => { Snd.engineStart(); say(`Prepara, ${car.short}!`); };
  S.exit = () => Snd.engineStop();
  S.buttons = () => {
    const b = [homeBtn()];
    if (done && doneT > 1.8) {
      const r = clamp(Math.min(W, H) * 0.11, 40, 80);
      b.push({ x: W / 2 - r * 1.5, y: H * 0.8, r, e: '🔁', color: '#ffd21f', pulse: true, fn: () => go(Race()) });
      b.push({ x: W / 2 + r * 1.5, y: H * 0.8, r, e: '🏠', color: '#5fd0ff', fn: () => go(Home()) });
    }
    return b;
  };
  S.down = (id, x, y) => { ptrs.add(id); ty = y + carLen * 0.25; if (count <= 0) touched = true; };
  S.move = (id, x, y) => { if (ptrs.has(id)) ty = y + carLen * 0.25; };
  S.up = id => ptrs.delete(id);

  S.update = dt => {
    t += dt; hudPop = Math.max(0, hudPop - dt * 3);
    if (count > 0) {
      count -= dt; const c = Math.ceil(count);
      if (c !== lastCount && c >= 1 && c <= 3) { lastCount = c; Snd.beep(false); }
      if (count <= 0) { Snd.beep(true); goT = 1; say('Vai!'); }
    }
    goT = Math.max(0, goT - dt);
    if (count <= 0 && !touched && !hintSaid && t > 5.5) { hintSaid = true; say('Segura o dedo na tela para correr!'); }
    const boosting = ptrs.size > 0 && count <= 0 && !done;
    const target = done || count > 0 ? 0 : boosting ? maxV : maxV * 0.3;
    v = lerp(v, target, 1 - Math.exp(-dt * (done ? 1.2 : boosting ? 2.2 : 1.5)));
    dist += v * dt;
    py = lerp(py, clamp(ty, yMin, yMax), 1 - Math.exp(-dt * 6));
    Snd.engineSet(count > 0 ? (ptrs.size ? 0.6 : 0.08) : v / maxV);
    wheelA += v * dt / (carLen * 0.1);

    // rival (Chick) — corre junto, mas sempre perde no final
    const prog = dist / L, rivalV = maxV * 0.55 * (1 + 0.15 * Math.sin(t * 0.7));
    if (count <= 0 && !done) { rwheelA += rivalV * dt / (carLen * 0.1); rivalOff += (rivalV - v) * dt; }
    if (!done) {
      const hi = lerp(carLen * 1.5, -carLen * 2.5, clamp((prog - 0.72) / 0.2, 0, 1));
      const lo = prog > 0.8 ? -W * 3 : -carLen * 1.5;
      rivalOff = clamp(rivalOff, lo, hi);
    }

    // estrelas
    while (!done && nextStar < dist + W * 1.4 && nextStar < L - W * 0.2) {
      const n = Math.random() < 0.35 ? 3 : 1, gy = rand(yMin, yMax);
      for (let i = 0; i < n; i++) stars.push({ wx: nextStar + i * carLen * 0.6, gy, got: false, ph: rand(0, 6) });
      nextStar += rand(0.45, 0.75) * W + (n - 1) * carLen * 0.6;
    }
    for (const s of stars) {
      if (s.got) continue;
      const sx = playerX + (s.wx - dist), dx = sx - (playerX + carLen * 0.1), dy = s.gy - py;
      if (Math.abs(dx) < carLen * 1.3 && Math.abs(dy) < carLen * 0.7) s.gy = lerp(s.gy, py, 1 - Math.exp(-dt * 4)); // ímã
      if (Math.abs(dx) < carLen * 0.6 && Math.abs(dy) < carLen * 0.35) {
        s.got = true; collected++; hudPop = 1; Snd.ding();
        burst(sx, s.gy - carLen * 0.35, 10, '#ffd21f', 300, carLen * 0.06, 's');
      }
    }
    stars = stars.filter(s => !s.got && playerX + (s.wx - dist) > -200);

    // fumaça
    puffT -= dt;
    if (count <= 0 && v > 5 && puffT < 0) {
      puffT = boosting ? 0.05 : 0.14;
      addP({ x: playerX - carLen * 0.5, y: py - carLen * 0.12, vx: -v * 0.25 - 40, vy: rand(-30, -5), life: 0.6, size: carLen * 0.04, grow: carLen * 0.12, color: 'rgba(220,220,220,.7)' });
    }

    // chegada
    if (!done && dist >= L) {
      done = true; doneT = 0; Snd.fanfare(); Snd.cheer(); confetti(80);
      say(`Katchau! ${car.short} ganhou! Você é o campeão!`);
    }
    if (done) { doneT += dt; if (doneT < 3 && Math.random() < dt * 20) confetti(3); }
  };

  function checker(x, y0, y1, sq) {
    for (let y = y0, r = 0; y < y1; y += sq, r++) for (let c = 0; c < 2; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#111' : '#fff'; ctx.fillRect(x + c * sq, y, sq, Math.min(sq, y1 - y));
    }
  }
  function drawFinish(fx) {
    const sq = (H - roadTop) / 9; checker(fx - sq, roadTop, H, sq);
    const top = roadTop - H * 0.32, px = fx;
    ctx.fillStyle = '#888'; ctx.fillRect(px - 4, top, 8, roadTop - top + 4);
    const fw = carLen * 0.9, fh = carLen * 0.55, n = 6, cs = fw / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < 4; j++) {
      const wave = Math.sin(now * 6 + i * 0.8) * fh * 0.08;
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect(px + 4 + i * cs, top + j * fh / 4 + wave, cs + 0.5, fh / 4 + 0.5);
    }
    text('CHEGADA', px, top - carLen * 0.12, carLen * 0.16, '#ffd21f', '#c40000');
  }
  function drawCountdown() {
    const r = Math.min(W, H) * 0.16;
    if (count > 0 && count <= 3) {
      const c = Math.ceil(count), f = count - Math.floor(count), s = 1 + f * 0.4;
      ctx.fillStyle = 'rgba(0,0,0,.35)'; circle(ctx, W / 2, H * 0.32, r * s);
      text(String(c), W / 2, H * 0.32, r * 1.3 * s, ['#2fae3a', '#ffd21f', '#e3161b'][c - 1], '#fff');
    } else if (goT > 0) {
      text('VAI!', W / 2, H * 0.32, r * (1.2 + (1 - goT) * 0.6), '#2fae3a', '#fff');
    }
  }
  S.draw = () => {
    const horizon = roadTop - H * 0.07;
    desert(dist, dist, horizon);
    ctx.fillStyle = '#f2c27b'; ctx.fillRect(0, horizon, W, roadTop - horizon);
    // cactos
    const P = Math.max(W * 0.38, 180), o = dist * 0.5, base = Math.floor(o / P);
    for (let k = -1; k <= Math.ceil(W / P) + 1; k++) {
      const idx = k + base, x = k * P - mod(o, P) + P * 0.5 * hash(idx);
      if (hash(idx + 11) < 0.6) cactus(x, roadTop - 4, (roadTop - horizon) * (0.9 + 0.6 * hash(idx + 5)));
      else { ctx.fillStyle = '#d9a35a'; ell(ctx, x, roadTop - 8, 18, 7); }
    }
    // pista
    ctx.fillStyle = '#4a4a50'; ctx.fillRect(0, roadTop, W, H - roadTop);
    curbs(roadTop, H * 0.025, dist);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const dw = W * 0.1, my = (roadTop + H) / 2;
    for (let x = -mod(dist, dw * 2); x < W; x += dw * 2) ctx.fillRect(x, my - 3, dw, 6);
    // largada / chegada
    const sx0 = playerX + carLen * 0.55 - dist; if (sx0 > -60) { const sq = (H - roadTop) / 9; checker(sx0 - sq, roadTop, H, sq); }
    const fx = playerX + carLen * 0.5 + (L - dist); if (fx < W + carLen * 2) drawFinish(fx);
    // linhas de velocidade
    if (v > maxV * 0.6) {
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const y = py - carLen * (0.05 + 0.08 * i), x = playerX - carLen * (0.6 + hash(i + Math.floor(now * 10)) * 0.4);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - carLen * 0.5, y); ctx.stroke();
      }
    }
    // objetos ordenados por profundidade
    const items = [];
    items.push({ y: rivalY(), d: () => drawCar(ctx, playerX + rivalOff, rivalY(), carLen * 0.95, RIVAL, { t: rwheelA, look: { x: 0.8, y: 0 } }) });
    const boosting = ptrs.size > 0 && count <= 0 && !done;
    items.push({ y: py, d: () => drawCar(ctx, playerX, py, carLen, car, { t: wheelA, happy: boosting || done, hop: done ? Math.abs(Math.sin(doneT * 6)) * carLen * 0.08 : Math.abs(Math.sin(t * 25)) * (v / maxV) * carLen * 0.012 }) });
    for (const s of stars) {
      const sx = playerX + (s.wx - dist);
      items.push({ y: s.gy, d: () => drawStar(ctx, sx, s.gy - carLen * 0.35 + Math.sin(now * 4 + s.ph) * carLen * 0.04, carLen * 0.14, Math.sin(now * 3 + s.ph) * 0.3) });
    }
    items.sort((a, b) => a.y - b.y).forEach(i => i.d());
    drawP();
    // HUD: progresso
    const bw = Math.min(W * 0.45, 420), bx = W / 2 - bw / 2, by = homeR() + 10;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(ctx, bx - 6, by - 10, bw + 12, 20, 10); ctx.fill();
    ctx.fillStyle = '#ffd21f'; rr(ctx, bx, by - 5, Math.max(10, bw * clamp(dist / L, 0, 1)), 10, 5); ctx.fill();
    emoji('🏁', bx + bw + 18, by, 28);
    drawCar(ctx, bx + bw * clamp(dist / L, 0, 1), by + 8, 46, car, { noShadow: true, t: wheelA });
    // HUD: estrelas
    const sr = clamp(Math.min(W, H) * 0.045, 18, 32) * (1 + hudPop * 0.35);
    drawStar(ctx, W - sr * 3, by, sr, 0);
    text(String(collected), W - sr * 1.3, by + 2, sr * 1.3, '#fff', '#c47a00');
    drawCountdown();
    if (count <= 0 && !touched && !done) {
      const s = Math.min(W, H) * 0.14 * (1 + 0.12 * Math.sin(now * 6));
      emoji('👆', W * 0.62, H * 0.72, s);
      text('Segure aqui!', W * 0.62, H * 0.72 + s * 0.85, s * 0.3, '#fff', '#333');
    }
    if (done) {
      const k = clamp(doneT / 0.6, 0, 1), e = 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
      const s = Math.min(W, H) * 0.26 * e;
      emoji('🏆', W / 2, H * 0.3, s, Math.sin(now * 3) * 0.08);
      text('VOCÊ GANHOU!', W / 2, H * 0.3 + s * 0.75, Math.min(W * 0.08, H * 0.09), '#ffd21f', '#c40000');
    }
    S.buttons().forEach(drawBtn);
  };
  return S;
}

/* =========================================================
   CENA: Lava-jato — esfregue para tirar a lama
   ========================================================= */
function Wash() {
  const S = {}, car = curCar();
  let mud = null, mctx = null, init = 1, remain = 1, len, gx, gy, bb, checkT = 0, done = false, doneT = 0, mudA = 1;
  let touched = false, sqT = 0, hopT = 0, hintSaid = false, t = 0, brush = 0;
  const ptr = new Map(); let look = { x: 0.7, y: 0 };
  function build() {
    len = Math.min(W * 0.78, H * 1.05, 760); gx = W / 2; gy = H * 0.5 + len * 0.29;
    mud = document.createElement('canvas'); mud.width = cv.width; mud.height = cv.height;
    mctx = mud.getContext('2d'); mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const tmp = document.createElement('canvas'); tmp.width = cv.width; tmp.height = cv.height;
    const tc = tmp.getContext('2d'); tc.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawCar(tc, gx, gy, len, car, { noShadow: true, blink: false });
    const cols = ['#6b4423', '#7b5230', '#5a3818', '#8a6239'];
    for (let i = 0; i < 130; i++) {
      const x = gx + rand(-0.5, 0.5) * len, y = gy - rand(0, 0.6) * len, r = len * rand(0.035, 0.075);
      mctx.fillStyle = cols[i % cols.length];
      for (let j = 0; j < 4; j++) circle(mctx, x + rand(-r, r), y + rand(-r, r), r * rand(0.6, 1.1));
      if (i % 5 === 0) { mctx.fillRect(x - r * 0.15, y, r * 0.3, r * 1.4); circle(mctx, x, y + r * 1.4, r * 0.2); }
    }
    mctx.fillStyle = 'rgba(40,20,5,.5)';
    for (let i = 0; i < 60; i++) circle(mctx, gx + rand(-0.5, 0.5) * len, gy - rand(0, 0.6) * len, len * rand(0.005, 0.015));
    mctx.save(); mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'destination-in'; mctx.drawImage(tmp, 0, 0); mctx.restore();
    mctx.globalCompositeOperation = 'destination-out';
    const x0 = clamp(Math.floor((gx - len * 0.56) * DPR), 0, mud.width - 1), y0 = clamp(Math.floor((gy - len * 0.7) * DPR), 0, mud.height - 1);
    const x1 = clamp(Math.ceil((gx + len * 0.56) * DPR), x0 + 1, mud.width), y1 = clamp(Math.ceil((gy + len * 0.05) * DPR), y0 + 1, mud.height);
    bb = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    init = Math.max(1, count()); remain = init; done = false; mudA = 1;
  }
  function count() {
    const d = mctx.getImageData(bb.x, bb.y, bb.w, bb.h).data; let n = 0;
    for (let i = 3; i < d.length; i += 4 * 9) if (d[i] > 60) n++;
    return n;
  }
  S.resize = () => { if (!done) build(); else { len = Math.min(W * 0.78, H * 1.05, 760); gx = W / 2; gy = H * 0.5 + len * 0.29; } };
  build();
  S.enter = () => say(`Ih! O ${car.short} está sujo de lama! Esfrega para lavar!`);
  S.buttons = () => {
    const b = [homeBtn()];
    if (done && doneT > 1.6) {
      const r = clamp(Math.min(W, H) * 0.1, 36, 70);
      b.push({ x: W / 2 - r * 1.5, y: H - r * 1.3, r, e: '🔁', color: '#ffd21f', pulse: true, fn: () => go(Wash()) });
      b.push({ x: W / 2 + r * 1.5, y: H - r * 1.3, r, e: '🏠', color: '#5fd0ff', fn: () => go(Home()) });
    }
    return b;
  };
  function scrub(x0, y0, x1, y1) {
    if (done) return;
    mctx.lineCap = 'round'; mctx.lineWidth = len * 0.17; mctx.strokeStyle = '#000';
    mctx.beginPath(); mctx.moveTo(x0, y0); mctx.lineTo(x1 + 0.1, y1); mctx.stroke();
    if (Math.random() < 0.6) addP({ type: 'b', x: x1 + rand(-20, 20), y: y1 + rand(-20, 20), vx: rand(-40, 40), vy: rand(-90, -30), life: rand(0.6, 1.2), size: rand(6, 16) * len / 500 + 4, grow: 6 });
    if (sqT <= 0 && Math.hypot(x1 - x0, y1 - y0) > 3) { Snd.squish(); sqT = 0.09; }
  }
  S.down = (id, x, y) => { ptr.set(id, { x, y }); touched = true; scrub(x, y, x, y); };
  S.move = (id, x, y) => { const p = ptr.get(id); if (!p) return; scrub(p.x, p.y, x, y); p.x = x; p.y = y; };
  S.up = id => ptr.delete(id);
  S.update = dt => {
    t += dt; sqT -= dt; hopT = Math.max(0, hopT - dt); if (ptr.size) brush += dt * 6;
    if (!touched && !hintSaid && t > 6) { hintSaid = true; say('Passa o dedo no carro!'); }
    const p = [...ptr.values()][0];
    const tx = p ? clamp((p.x - (gx + len * 0.1)) / (len * 0.4), -1, 1) : 0.7, tyy = p ? clamp((p.y - (gy - len * 0.38)) / (len * 0.3), -1, 1) : 0;
    look = { x: lerp(look.x, tx, 1 - Math.exp(-dt * 8)), y: lerp(look.y, tyy, 1 - Math.exp(-dt * 8)) };
    checkT -= dt;
    if (!done && checkT <= 0) {
      checkT = 0.35; remain = count();
      if (remain / init < 0.1) {
        done = true; doneT = 0; hopT = 0.7; Snd.fanfare(); confetti(50);
        say(`Uau! O ${car.short} está brilhando! Katchau!`);
      }
    }
    if (done) {
      doneT += dt; mudA = Math.max(0, mudA - dt * 2);
      if (doneT < 2.5 && Math.random() < dt * 14) addP({ type: 'e', e: '✨', x: gx + rand(-0.45, 0.45) * len, y: gy - rand(0.05, 0.55) * len, vy: -20, life: 0.9, size: len * rand(0.06, 0.11) });
      if (doneT > 1.2 && hopT <= 0 && doneT < 4) hopT = 0.7;
    }
  };
  S.draw = () => {
    // fundo: azulejos
    ctx.fillStyle = '#c4e9ff'; ctx.fillRect(0, 0, W, H);
    const ts = Math.max(40, Math.min(W, H) * 0.1); ctx.strokeStyle = '#a5d9f7'; ctx.lineWidth = 2;
    ctx.beginPath(); for (let x = 0; x < W; x += ts) { ctx.moveTo(x, 0); ctx.lineTo(x, gy); } for (let y = 0; y < gy; y += ts) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
    text('LAVA-JATO', W / 2, Math.max(28, H * 0.07), Math.min(W * 0.07, H * 0.075), '#fff', '#1e6fe0');
    // chão
    ctx.fillStyle = '#8fa0ad'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = 'rgba(80,170,255,.45)'; ell(ctx, gx, gy + len * 0.03, len * 0.62, len * 0.06);
    // escovas giratórias
    const bwid = Math.max(30, W * 0.06), btop = H * 0.12;
    [W * 0.045, W * 0.955].forEach((bx, i) => {
      ctx.fillStyle = '#555'; ctx.fillRect(bx - 4, btop - 20, 8, 22);
      ctx.save(); rr(ctx, bx - bwid / 2, btop, bwid, gy - btop, bwid * 0.4); ctx.clip();
      ctx.fillStyle = i ? '#ff7ac0' : '#5fb6ff'; ctx.fillRect(bx - bwid, btop, bwid * 2, gy - btop);
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      const st = bwid * 0.55; for (let y = btop - st * 2 + mod(brush * st * 2, st * 2); y < gy; y += st * 2) ctx.fillRect(bx - bwid, y, bwid * 2, st * 0.7);
      ctx.restore();
    });
    // carro + lama
    const hop = hopT > 0 ? Math.sin((1 - hopT / 0.7) * Math.PI) * len * 0.1 : 0;
    drawCar(ctx, gx, gy, len, car, { look, happy: done || ptr.size > 0, hop });
    if (mudA > 0) { ctx.save(); ctx.globalAlpha = mudA; ctx.setTransform(1, 0, 0, 1, 0, -hop * DPR); ctx.drawImage(mud, 0, 0); ctx.restore(); }
    drawP();
    // esponjas
    for (const p of ptr.values()) emoji('🧽', p.x, p.y, len * 0.16, Math.sin(now * 20) * 0.2);
    if (!touched) {
      const s = Math.min(W, H) * 0.13, k = Math.sin(now * 3);
      emoji('🧽', gx + k * len * 0.25, gy - len * 0.3, s, k * 0.3);
    }
    // barra de progresso de limpeza
    const pct = done ? 1 : clamp(1 - remain / init, 0, 1) / 0.9;
    const bwd = Math.min(W * 0.4, 360), bx0 = W / 2 - bwd / 2, by0 = H - 26;
    if (!(done && doneT > 1.6)) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(ctx, bx0 - 4, by0 - 10, bwd + 8, 20, 10); ctx.fill();
      ctx.fillStyle = '#5fd0ff'; rr(ctx, bx0, by0 - 6, Math.max(12, bwd * clamp(pct, 0, 1)), 12, 6); ctx.fill();
      emoji('✨', bx0 + bwd + 22, by0, 26);
    }
    S.buttons().forEach(drawBtn);
  };
  return S;
}

/* =========================================================
   CENA: Pintura — toque nas tintas para pintar o carro
   ========================================================= */
const COLORS = [['Vermelho', '#e3161b'], ['Laranja', '#ff8a00'], ['Amarelo', '#f5c518'], ['Verde', '#2fae3a'], ['Azul', '#1e6fe0'], ['Roxo', '#8a3ffc'], ['Rosa', '#ff5fa8'], ['Branco', '#f2f2f2']];
function Paint() {
  const S = {}, car = curCar();
  const items = [{ name: 'Cor original', c: car.color, orig: true }, ...COLORS.map(([n, c]) => ({ name: n, c }))];
  let flying = [], hopT = 0, sq = 0;
  function lay() {
    const port = H > W * 1.05, o = { pos: [] };
    if (port) {
      o.len = Math.min(W * 0.86, H * 0.5); o.gx = W / 2; o.gy = H * 0.36 + o.len * 0.28;
      o.r = Math.min(W / 11.5, H * 0.055);
      items.forEach((it, i) => { const row = i < 5 ? 0 : 1, n = row ? 4 : 5, j = row ? i - 5 : i; o.pos.push({ x: W * (j + 0.5) / n, y: H * (0.72 + row * 0.13) }); });
    } else {
      o.len = Math.min(W * 0.55, H * 0.9); o.gx = W / 2; o.gy = H * 0.4 + o.len * 0.28;
      o.r = Math.min(W / 22, H * 0.085);
      items.forEach((it, i) => o.pos.push({ x: W * (i + 0.5) / items.length, y: H - o.r * 1.5 }));
    }
    return o;
  }
  S.enter = () => say('Escolha uma cor para pintar o ' + car.short + '!');
  S.buttons = () => [homeBtn()];
  S.down = (id, x, y) => {
    const o = lay();
    for (let i = 0; i < items.length; i++) {
      const p = o.pos[i];
      if (Math.hypot(x - p.x, y - p.y) < o.r * 1.25) {
        flying.push({ x0: p.x, y0: p.y, t: 0, it: items[i] }); Snd.pop(); return;
      }
    }
    if (Math.abs(x - o.gx) < o.len * 0.5 && y < o.gy && y > o.gy - o.len * 0.62) { hopT = 0.6; Snd.honk(); say(car.say); }
  };
  S.update = dt => {
    hopT = Math.max(0, hopT - dt); sq *= Math.exp(-dt * 6);
    const o = lay();
    for (const f of flying) {
      f.t += dt;
      if (f.t >= 0.45 && !f.hit) {
        f.hit = true;
        if (f.it.orig) delete paint[car.id]; else paint[car.id] = f.it.c;
        store.set('paint', paint); Snd.splash(); say(f.it.name + '!'); sq = 0.12;
        burst(o.gx, o.gy - o.len * 0.3, 30, f.it.c, o.len * 1.4, o.len * 0.035);
        burst(o.gx, o.gy - o.len * 0.3, 8, '#ffd21f', o.len, o.len * 0.04, 's');
      }
    }
    flying = flying.filter(f => !f.hit);
  };
  S.draw = () => {
    const o = lay();
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#7d4fc0'); g.addColorStop(1, '#3d2266');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 16; i++) { ctx.fillStyle = CONF[i % 6]; ctx.globalAlpha = 0.18; circle(ctx, hash(i) * W, hash(i + 20) * o.gy, 20 + hash(i + 40) * 50); }
    ctx.globalAlpha = 1;
    text('PINTURA', W / 2, Math.max(28, H * 0.07), Math.min(W * 0.08, H * 0.075), '#fff', '#8a3ffc');
    ctx.fillStyle = '#2b1a47'; ctx.fillRect(0, o.gy, W, H - o.gy);
    const sg = ctx.createRadialGradient(o.gx, o.gy, 0, o.gx, o.gy, o.len * 0.7);
    sg.addColorStop(0, 'rgba(255,255,220,.5)'); sg.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = sg; ell(ctx, o.gx, o.gy, o.len * 0.7, o.len * 0.12);
    const hop = hopT > 0 ? Math.sin((1 - hopT / 0.6) * Math.PI) * o.len * 0.12 : 0;
    drawCar(ctx, o.gx, o.gy, o.len, car, { hop, squash: sq, happy: sq > 0.01 || hopT > 0, look: { x: 0.5, y: 0.6 } });
    // tintas
    items.forEach((it, i) => {
      const p = o.pos[i], b = 1 + 0.05 * Math.sin(now * 4 + i), r = o.r * b;
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ell(ctx, p.x, p.y + r * 0.9, r * 0.9, r * 0.2);
      ctx.fillStyle = it.c; circle(ctx, p.x, p.y, r);
      for (let d = 0; d < 5; d++) { const a = d * TAU / 5 + 0.3; circle(ctx, p.x + Math.cos(a) * r * 0.95, p.y + Math.sin(a) * r * 0.95, r * 0.22); }
      ctx.lineWidth = r * 0.12; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.98, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ell(ctx, p.x - r * 0.35, p.y - r * 0.35, r * 0.22, r * 0.14);
      if (it.orig) emoji('⭐', p.x, p.y, r * 1.1);
      const selIdx = paint[car.id] ? items.findIndex(x => !x.orig && x.c === paint[car.id]) : 0;
      if (i === selIdx) {
        ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.3, 0, TAU); ctx.stroke();
      }
    });
    // gotas voando
    for (const f of flying) {
      const k = clamp(f.t / 0.45, 0, 1), x = lerp(f.x0, o.gx, k), y = lerp(f.y0, o.gy - o.len * 0.3, k) - Math.sin(k * Math.PI) * o.len * 0.35;
      ctx.fillStyle = f.it.c; circle(ctx, x, y, o.r * 0.6); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    }
    drawP();
    S.buttons().forEach(drawBtn);
  };
  return S;
}

/* =========================================================
   motor principal
   ========================================================= */
let scene = null;
function go(s) {
  if (scene && scene.exit) scene.exit();
  parts = []; scene = s; if (s.enter && Snd.ac) s.enter();
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene && scene.resize) scene.resize();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

let unlocked = false;
function unlock() {
  Snd.init();
  if (!unlocked) { unlocked = true; if (scene.onUnlock) scene.onUnlock(); else if (scene.enter) scene.enter(); }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlock();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const x = e.clientX, y = e.clientY;
  for (const b of (scene.buttons ? scene.buttons() : [])) {
    if (Math.hypot(x - b.x, y - b.y) <= b.r * 1.15) { Snd.pop(); b.fn(); return; }
  }
  scene.down && scene.down(e.pointerId, x, y);
});
cv.addEventListener('pointermove', e => { e.preventDefault(); scene.move && scene.move(e.pointerId, e.clientX, e.clientY); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, e => { scene.up && scene.up(e.pointerId); }));
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (!Snd.ac) return;
  if (document.hidden) { Snd.ac.suspend(); if (window.speechSynthesis) speechSynthesis.cancel(); } else Snd.ac.resume();
});

scene = Home();
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; now += dt;
  scene.update(dt); updP(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  scene.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
